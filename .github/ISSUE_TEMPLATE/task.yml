name: Task
description: A piece of work to be done
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What needs to happen
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What this unblocks, or what it costs us to not do it.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done looks like
      description: How we'll know this is finished.
      placeholder: |
        - [ ] ...
    validations:
      required: false
