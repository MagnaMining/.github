name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a **security** issue, stop and follow
        [SECURITY.md](https://github.com/magnamining/.github/blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, or the conditions that trigger it. "Happens every night around 2am" is a valid answer.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocking - something in production is down or wrong
        - Degraded - works, but incorrectly or unreliably
        - Annoying - has a workaround
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant output. Redact any credentials first.
      render: shell
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Where
      description: Which environment, server, or site this occurred on.
    validations:
      required: false
