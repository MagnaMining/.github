name: Something is broken
description: Report something that isn't working or gives the wrong result
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Don't open an issue. Follow
        [SECURITY.md](https://github.com/magnamining/.github/blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to make it happen again
      description: Steps, or when it happens. "Every night around 2am" is a fine answer.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: How bad is it
      options:
        - Down - something in production is broken or wrong
        - Unreliable - it works, but not properly
        - Annoying - there's a workaround
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: Optional. Remove any passwords or keys before you paste.
      render: shell
